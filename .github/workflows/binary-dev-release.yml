name: Publish dev binaries

on:
  workflow_dispatch:
    inputs:
      specific_name:
        description: 'Optional dev release suffix. With no suffix, main publishes to dev and other branches to dev-<branch>.'
        required: false
        type: string

concurrency:
  group: cpa-usage-keeper-dev-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  binary-dev-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve dev release tag
        id: release
        env:
          INPUT_NAME: ${{ inputs.specific_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "Manual dev publishing requires a branch: $GITHUB_REF" >&2
            exit 1
          fi

          tag=dev
          if [[ "$GITHUB_REF_NAME" != main || -n "$INPUT_NAME" ]]; then
            label=${INPUT_NAME:-$GITHUB_REF_NAME}
            suffix=$(printf '%s' "$label" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-90 | sed -E 's/-+$//')
            if [[ -z "$suffix" ]]; then
              echo 'The dev release suffix must contain a letter or number.' >&2
              exit 1
            fi
            tag="dev-$suffix"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zip

      - name: Install frontend dependencies
        run: npm --prefix ./web ci

      - name: Build frontend
        run: npm --prefix ./web run build

      - name: Build binary package
        env:
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          CGO_ENABLED: '1'
          CC: gcc
          CGO_CFLAGS: '-O2 -g -march=x86-64 -mtune=generic'
        run: |
          set -euo pipefail
          package_name=cpa-usage-keeper_linux_amd64
          package_dir="dist/$package_name"
          mkdir -p "$package_dir/data"

          go build -trimpath -ldflags="-s -w" -o "$package_dir/cpa-usage-keeper" ./cmd/server/main.go
          elf_notes=$(readelf -n "$package_dir/cpa-usage-keeper")
          if grep -Eq 'x86 ISA needed:.*x86-64-v[234]' <<< "$elf_notes"; then
            echo 'The Linux amd64 binary requires a newer x86-64 ISA than baseline.' >&2
            exit 1
          fi

          cp .env.example README.md README.zh.md LICENSE "$package_dir/"
          cp -R docs "$package_dir/"
          cp deploy/cpa-usage-keeper.example.service "$package_dir/cpa-usage-keeper.service"
          cd dist
          zip -qr "$package_name.zip" "$package_name"
          sha256sum "$package_name.zip" > checksums.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          title="Development build ($RELEASE_TAG)"
          notes=$(printf 'Linux amd64 build from %s at %s.\n\n[Build run](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          assets=(dist/cpa-usage-keeper_linux_amd64.zip dist/checksums.txt)

          if prerelease=$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease); then
            if [[ "$prerelease" != true ]]; then
              echo "Refusing to replace a non-development release: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit "$RELEASE_TAG" --title "$title" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "$title" --notes "$notes" --prerelease --latest=false
          fi

          printf '[Download Linux amd64 ZIP](%s/%s/releases/download/%s/cpa-usage-keeper_linux_amd64.zip)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
